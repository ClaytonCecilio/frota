<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frota Alpha</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1830">
<style>
:root{--navy:#0B1830;--navy2:#13284d;--laranja:#F26A0F;--fundo:#EEF2F8;--texto:#0B1830;--sub:#5b6b82;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fundo);color:var(--texto)}
header{position:relative;background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:14px 16px;border-bottom:4px solid var(--laranja);display:flex;align-items:center;gap:12px}
header img{width:52px;height:52px;border-radius:50%;flex:none}
header h1{margin:0;font-size:1.2rem;letter-spacing:.3px}
header p{margin:2px 0 0;opacity:.8;font-size:.85rem}
main{max-width:520px;margin:0 auto;padding:14px 16px 24px;display:grid;gap:14px}
a.op{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:16px;padding:18px;text-decoration:none;color:var(--texto);box-shadow:0 2px 8px rgba(11,24,48,.1);border-left:6px solid var(--laranja)}
a.op:active{transform:scale(.98)}
.ic{flex:none;width:54px;height:54px;border-radius:14px;background:var(--navy);display:grid;place-items:center}
.ic svg{width:28px;height:28px;fill:var(--laranja)}
.t{font-weight:700;font-size:1.15rem}
.d{font-size:.88rem;color:var(--sub);margin-top:2px}
.seta{margin-left:auto;font-size:1.6rem;color:var(--sub)}
.sec{margin:10px 4px 0;font-size:.85rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--sub)}
.redes{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:4px 0}
.redes a{width:52px;height:52px;border-radius:50%;background:var(--navy);display:grid;place-items:center;box-shadow:0 2px 6px rgba(11,24,48,.15)}
.redes a:active{transform:scale(.95)}
.redes svg{width:24px;height:24px;fill:#fff}
.wa{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--texto);box-shadow:0 2px 6px rgba(11,24,48,.08)}
.wa:active{transform:scale(.98)}
.wa .ic{background:#25D366;border-radius:50%;width:46px;height:46px}
.wa .ic svg{fill:#fff;width:26px;height:26px}
.wa .acao{margin-left:auto;font-size:.85rem;font-weight:700;color:#128C7E}
footer{text-align:center;color:var(--sub);font-size:.85rem;padding:0 16px 28px}
</style>
</head>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutoriais Frota Alpha</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1830">
<style>
:root{--navy:#0B1830;--navy2:#13284d;--laranja:#F26A0F;--fundo:#EEF2F8;--texto:#0B1830;--sub:#5b6b82;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fundo);color:var(--texto)}
header{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:28px 16px 34px;text-align:center;border-bottom:5px solid var(--laranja)}
header img{width:84px;height:84px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
header h1{margin:12px 0 4px;font-size:1.45rem;letter-spacing:.5px}
header p{margin:0;opacity:.8;font-size:.95rem}
main{max-width:520px;margin:0 auto;padding:18px 16px 32px}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--sub);margin:22px 4px 10px}
a.btn{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;text-decoration:none;color:var(--texto);box-shadow:0 2px 6px rgba(11,24,48,.08);border-left:5px solid var(--laranja)}
a.btn:active{transform:scale(.98)}
.play{flex:none;width:44px;height:44px;border-radius:50%;background:var(--laranja);display:grid;place-items:center}
.play svg{width:18px;height:18px;fill:#fff;margin-left:3px}
.t{font-weight:700;font-size:1.02rem}
.d{font-size:.85rem;color:var(--sub);margin-top:2px}
.vazio{color:var(--sub);font-size:.9rem;padding:4px}
.item{margin-bottom:10px}
.item.aberto a.btn{border-radius:14px 14px 0 0;margin-bottom:0}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:0 0 14px 14px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt{display:block;text-align:right;font-size:.8rem;color:var(--sub);padding:6px 4px 0}
footer{text-align:center;color:var(--sub);font-size:.85rem;padding:0 16px 28px}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="Frota Alpha">
  <h1>Tutoriais Frota Alpha</h1>
  <p>Toque no tutorial para assistir aqui mesmo</p>
</header>
<main id="lista"></main>
<footer>Dúvidas? Procure o Gestor da frota.</footer>
<script src="tutoriais.js"></script>
<script>
const grupos = ["Condutor", "Gestor da frota"];
const play = '<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function idYoutube(url){
  const m = String(url).match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}
const main = document.getElementById("lista");
main.innerHTML = grupos.map(g => {
  const itens = (window.TUTORIAIS || []).filter(t => t.grupo === g);
  if (!itens.length) return "";
  return `<h2>${esc(g)}</h2>` + itens.map(t =>
    `<div class="item" data-id="${esc(idYoutube(t.video) || "")}">
     <a class="btn" href="${esc(t.video)}" target="_blank" rel="noopener">
       <span class="play">${play}</span>
       <span><div class="t">${esc(t.titulo)}</div>${t.descricao ? `<div class="d">${esc(t.descricao)}</div>` : ""}</span>
     </a></div>`).join("");
}).join("") || '<p class="vazio">Nenhum tutorial ainda.</p>';

main.addEventListener("click", e => {
  const a = e.target.closest("a.btn");
  if (!a) return;
  const item = a.parentElement, id = item.dataset.id;
  if (!id) return; // sem ID do YouTube: abre o link normalmente
  e.preventDefault();
  if (item.classList.contains("aberto")) { fechar(item); return; }
  document.querySelectorAll(".item.aberto").forEach(fechar);
  item.classList.add("aberto");
  item.insertAdjacentHTML("beforeend",
    `<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Vídeo"></iframe></div>
     <a class="yt" href="${a.href}" target="_blank" rel="noopener">Abrir no YouTube</a>`);
  item.scrollIntoView({behavior: "smooth", block: "start"});
});
function fechar(item){
  item.classList.remove("aberto");
  item.querySelectorAll(".player,.yt").forEach(el => el.remove());
}
</script>
</body>
</html>

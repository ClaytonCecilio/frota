<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutoriais - Frota Alpha</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1830">
<style>
:root{--navy:#0B1830;--navy2:#13284d;--laranja:#F26A0F;--fundo:#EEF2F8;--texto:#0B1830;--sub:#5b6b82;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fundo);color:var(--texto)}
header{position:relative;background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:28px 16px 34px;text-align:center;border-bottom:5px solid var(--laranja)}
header img{width:84px;height:84px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
header h1{margin:12px 0 4px;font-size:1.45rem;letter-spacing:.5px}
header p{margin:0;opacity:.8;font-size:.95rem}
main{max-width:520px;margin:0 auto;padding:18px 16px 32px}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--sub);margin:22px 4px 10px}
.voltar{position:absolute;left:14px;top:14px;color:#fff;text-decoration:none;font-size:.95rem;opacity:.85}
.item{background:var(--card);border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:0 2px 6px rgba(11,24,48,.08);border-top:4px solid var(--laranja)}
.cab{padding:12px 14px}
.t{font-weight:700;font-size:1.02rem}
.d{font-size:.85rem;color:var(--sub);margin-top:2px}
.player{position:relative;aspect-ratio:16/9;background:#000 center/cover no-repeat;cursor:pointer;display:block;width:100%;border:0;padding:0}
.player.vertical{aspect-ratio:9/16;border-radius:12px;max-height:80vh;max-width:calc(80vh*9/16);margin:0 auto}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:var(--laranja);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.player .play svg{width:26px;height:26px;fill:#fff;margin-left:4px}
.yt{display:block;text-align:right;font-size:.8rem;color:var(--sub);padding:8px 14px 10px;text-decoration:none}
a.link{display:block;padding:0 14px 12px;color:var(--laranja);font-weight:600}
.vazio{color:var(--sub);font-size:.9rem;padding:4px}
footer{text-align:center;color:var(--sub);font-size:.85rem;padding:0 16px 28px}
</style>
</head>

  <h1>Tutoriais</h1>
  <p>Toque no vídeo para assistir</p>
</header>
<main id="lista"></main>
<footer>Dúvidas? Procure o Gestor da frota.</footer>
<script src="tutoriais.js"></script>
<script>
const grupos = ["Condutor", "Gestor da frota"];
const play = '<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function idYoutube(url){
  const m = String(url).match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}
const main = document.getElementById("lista");
main.innerHTML = grupos.map(g => {
  const itens = (window.TUTORIAIS || []).filter(t => t.grupo === g);
  if (!itens.length) return "";
  return `<h2>${esc(g)}</h2>` + itens.map(t => {
    const id = idYoutube(t.video);
    const cab = `<div class="cab"><div class="t">${esc(t.titulo)}</div>${t.descricao ? `<div class="d">${esc(t.descricao)}</div>` : ""}</div>`;
    if (!id) return `<div class="item">${cab}<a class="link" href="${esc(t.video)}" target="_blank" rel="noopener">Abrir</a></div>`;
    return `<div class="item">${cab}
      <button class="player${t.vertical ? " vertical" : ""}" data-id="${id}" aria-label="Assistir ${esc(t.titulo)}"
        style="background-image:url('${esc(t.capa || `https://i.ytimg.com/vi/${id}/hqdefault.jpg`)}')"><span class="play">${play}</span></button>
      <a class="yt" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Abrir no YouTube ↗</a></div>`;
  }).join("");
}).join("") || '<p class="vazio">Nenhum tutorial ainda.</p>';

main.addEventListener("click", e => {
  const p = e.target.closest("button.player");
  if (!p || p.querySelector("iframe")) return;
  p.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${p.dataset.id}?autoplay=1&rel=0&playsinline=1"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Vídeo"></iframe>`;
});
</script>
</body>
